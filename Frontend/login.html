<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AutoCare | Login</title>

    <link href="./assets/styles/app.css" rel="stylesheet" />
  </head>

  <body class="min-h-screen">
    <!-- BACKGROUND -->
    <main
      class="relative min-h-screen bg-cover bg-center"
      style="background-image: url('./assets/images/blurred-car-repair-shop-interior-mechanics-working-cars-table-foreground-busy-auto-scene-modern-service-pro-maintenance-349399980.webp')"
    >
      <!-- DARK OVERLAY -->
      <div class="absolute inset-0 bg-black/65"></div>

      <!-- CENTER -->
      <div
        class="relative z-10 flex min-h-screen items-center justify-center px-4"
      >
        <!-- LOGIN CARD -->
        <div
          class="h-150 w-120 max-w-full rounded-2xl bg-white px-10 py-10 shadow-2xl"
        >
          <!-- HEADER -->
          <div class="mb-9 text-center">
            <!-- LOGO -->
            <div
              class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-xl bg-orange-500"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.8"
                stroke="white"
                class="h-6 w-6"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M8.25 6.75h7.5M6 10.5h12M7.5 14.25h9M5.25 19.5h13.5a1.5 1.5 0 0 0 1.5-1.5V6A1.5 1.5 0 0 0 18.75 4.5H5.25A1.5 1.5 0 0 0 3.75 6v12a1.5 1.5 0 0 0 1.5 1.5Z"
                />
              </svg>
            </div>

            <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>

            <p class="mt-2 text-sm text-slate-500">
              Sign in to your AutoCare account
            </p>
          </div>

          <!-- FORM -->
          <form class="space-y-5">
            <!-- EMAIL -->
            <div>
              <label
                for="email"
                class="mb-2 block text-sm font-medium text-slate-700"
              >
                Email address
              </label>

              <input
                id="email"
                name="email"
                type="email"
                placeholder="john@example.com"
                class="h-12 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-orange-500 focus:bg-white focus:ring-2 focus:ring-orange-500/20"
              />
            </div>

            <!-- PASSWORD -->
            <div>
              <div class="mb-2 flex items-center justify-between">
                <label
                  for="password"
                  class="text-sm font-medium text-slate-700"
                >
                  Password
                </label>

                <a
                  href="#"
                  class="text-xs font-medium text-orange-500 transition hover:text-orange-600"
                >
                  Forgot password?
                </a>
              </div>

              <input
                id="password"
                name="password"
                type="password"
                placeholder="••••••••"
                class="h-12 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-orange-500 focus:bg-white focus:ring-2 focus:ring-orange-500/20"
              />
            </div>

            <!-- REMEMBER -->
            <div class="flex items-center gap-2 pt-1">
              <input
                id="remember"
                type="checkbox"
                class="h-4 w-4 rounded border-slate-300 text-orange-500 focus:ring-orange-500"
              />

              <label for="remember" class="text-sm text-slate-500">
                Remember me
              </label>
            </div>

            <!-- LOGIN BUTTON -->
            <button
              type="submit"
              class="mt-2 h-12 w-full rounded-lg bg-orange-500 text-sm font-semibold text-white transition hover:bg-orange-600 active:scale-[0.99]"
            >
              Sign in
            </button>
          </form>

          <!-- DIVIDER -->
          <div class="my-8 flex items-center gap-4">
            <div class="h-px flex-1 bg-slate-200"></div>

            <span class="text-xs text-slate-400"> OR </span>

            <div class="h-px flex-1 bg-slate-200"></div>
          </div>

          <!-- REGISTER -->
          <div class="text-center">
            <p class="text-sm text-slate-500">
              Don't have an account?

              <a
                href="register.html"
                class="ml-1 font-semibold text-orange-500 transition hover:text-orange-600"
              >
                Create an account
              </a>
            </p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
