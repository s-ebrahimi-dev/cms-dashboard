<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AutoCare | Login</title>

    <link href="/styles/app.css" rel="stylesheet" />
  </head>

  <body class="min-h-screen">
    <!-- BACKGROUND -->
    <main
      class="relative min-h-screen bg-cover bg-center"
      style="background-image: url(&quot;/images/cover.png&quot;)"
    >
      <!-- DARK OVERLAY -->
      <div class="absolute inset-0 bg-black/25"></div>

      <!-- CENTER -->
      <div
        class="relative z-10 flex min-h-screen items-center justify-center px-4"
      >
        <!-- LOGIN CARD -->
        <div
          class="login-card h-155 w-120 max-w-full rounded-2xl /45 px-10 py-4 bg-white/45 shadow-2xl overflow-y-auto"
        >
          <!-- HEADER -->
          <div class="mb-9 text-center">
            <!-- LOGO -->
            <div class="mx-auto mb-5 flex h-16 items-center justify-center">
              <img class="" src="/images/icon-2.png" alt="logo-png" />
            </div>

            <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>

            <p class="mt-2 text-sm text-zinc-950">
              Sign in to your AutoCare account
            </p>
          </div>

          <!-- FORM -->

          <form id="login-form" class="space-y-5">
            <!-- PHONE STEP -->
            <div id="phone-step" class="space-y-5">
              <div>
                <label
                  for="phone"
                  class="mb-2 block text-sm font-medium text-slate-700"
                >
                  Mobile number
                </label>

                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  inputmode="tel"
                  autocomplete="tel"
                  placeholder="09123456789"
                  maxlength="13"
                  required
                  class="h-12 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-orange-500 focus:bg-white focus:ring-2 focus:ring-orange-500/20"
                />
              </div>

              <button
                id="send-otp-button"
                type="submit"
                class="mt-2 flex h-12 w-full items-center justify-center rounded-lg bg-blue-500 text-sm font-semibold text-white transition hover:bg-indigo-600 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-60"
              >
                Send verification code
              </button>
            </div>

            <!-- OTP STEP -->
            <div id="otp-step" class="hidden space-y-5">
              <p class="text-sm text-slate-700">
                Enter the verification code sent to your mobile number.
              </p>

              <div>
                <label
                  for="otp-code"
                  class="mb-2 block text-sm font-medium text-slate-700"
                >
                  Verification code
                </label>

                <input
                  id="otp-code"
                  name="otp-code"
                  type="text"
                  inputmode="numeric"
                  autocomplete="one-time-code"
                  pattern="[0-9۰-۹٠-٩]{4,6}"
                  minlength="4"
                  maxlength="6"
                  placeholder="Enter your code"
                  class="h-12 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-orange-500 focus:bg-white focus:ring-2 focus:ring-orange-500/20"
                />
              </div>

              <button
                id="verify-otp-button"
                type="button"
                class="flex h-12 w-full items-center justify-center rounded-lg bg-blue-500 text-sm font-semibold text-white transition hover:bg-indigo-600 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-60"
              >
                Verify and sign in
              </button>

              <button
                id="resend-otp-button"
                type="button"
                class="w-full text-sm font-medium text-indigo-800 transition hover:text-blue-500 disabled:cursor-not-allowed disabled:opacity-60"
              >
                Resend code
              </button>

              <button
                id="change-phone-button"
                type="button"
                class="w-full text-sm text-slate-600 transition hover:text-slate-900"
              >
                Change mobile number
              </button>
            </div>
          </form>

          <!-- DIVIDER -->
          <div class="my-8 flex items-center gap-4">
            <div class="h-px flex-1 bg-slate-200"></div>

            <span class="text-xs text-slate-400"> OR </span>

            <div class="h-px flex-1 bg-slate-200"></div>
          </div>

          <!-- REGISTER -->
          <div class="text-center">
            <p class="text-sm text-zinc-950">
              Don't have an account?

              <a
                href="./register.html"
                class="cursor-default md:cursor-pointer ml-1 font-semibold text-indigo-800 transition hover:text-blue-500"
              >
                Create an account
              </a>
            </p>
          </div>
        </div>
      </div>
      <div id="result-modal-container"></div>
      <div id="loader-container"></div>
    </main>

    <script type="module" src="/scripts/loginOtp.js"></script>
  </body>
</html>
