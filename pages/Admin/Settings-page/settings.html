<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AutoCare - Settings</title>

    <link rel="stylesheet" href="/styles/app.css" />
    <script src="../../../scripts/theme.js"></script>
  </head>

  <body class="relative text-slate-900">
    <svg class="hidden">
      <symbol
        id="arrow-right"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m8.25 4.5 7.5 7.5-7.5 7.5"
        />
      </symbol>
      <symbol
        id="arrow-left"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15.75 19.5 8.25 12l7.5-7.5"
        />
      </symbol>
      <symbol
        id="moon"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
        />
      </symbol>
      <symbol
        id="sun"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
        />
      </symbol>
    </svg>

    <div class="layout">
      <!-- Sidebar -->

      <section id="sidebar-container" class="sidebar-container z-50">
        <!-- Data Loaded By Js -->
      </section>

      <!-- Mobile sidebar -->
      <section id="mobile-sidebar-container">
        <!-- Data loaded By JS -->
      </section>

      <!-- Main -->

      <main class="main">
        <header class="flex items-center justify-between mb-8">
          <div>
            <h2 class="text-3xl font-bold">Settings</h2>
          </div>

          <div class="flex items-center gap-4">
            <input
              class="hidden md:block w-72 px-4 py-3 rounded-xl border border-slate-200 bg-white outline-none focus:ring-2 focus:ring-indigo-500"
              placeholder="Search..."
            />

            <button
              class="w-12 h-12 rounded-xl bg-white border border-slate-200"
            >
              🔔
            </button>

            <div
              class="flex items-center justify-between gap-3 md:w-25 md:gap-0.5 md:pr-2 bg-white rounded-full shrink-0 border border-slate-200"
            >
              <div>
                <img
                  src=""
                  class="user-image w-10 h-10 md:w-8 md:h-8 rounded-full object-cover bg-indigo-600"
                  alt="user-image"
                />
              </div>

              <div class="hidden md:block">
                <p class="font-semibold md:text-[10px] text-sm">Saeed</p>
                <p class="text-xs md:text-[8px] text-">Administrator</p>
              </div>
            </div>
          </div>
          <div class="theme-btn cursor-default sm:cursor-pointer">
            <svg class="inline-block dark:hidden w-8 h-8">
              <use href="#moon"></use>
            </svg>
            <svg class="hidden dark:inline-block w-8 h-8">
              <use href="#sun"></use>
            </svg>
          </div>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
          <!-- Profile -->

          <section
            class="xl:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm p-6"
          >
            <h2 class="text-xl font-bold mb-6">Profile Information</h2>

            <div class="grid md:grid-cols-2 gap-5">
              <div class="md:col-span-2">
                <!-- Profile Picture -->
                <div class="mb-8">
                  <label class="block text-sm mb-3 text-slate-600">
                    Profile Picture
                  </label>

                  <div class="flex flex-col items-center w-fit">
                    <!-- Large profile image -->
                    <div
                      class="w-32 h-32 rounded-full border-4 border-slate-200 p-1 overflow-hidden bg-slate-100"
                    >
                      <img
                        id="profile-preview"
                        src="/images/default-profile.png"
                        alt="Profile picture"
                        class="w-full h-full rounded-full object-cover"
                      />
                    </div>

                    <!-- Change button -->
                    <label
                      for="profile-image"
                      class="mt-4 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium cursor-pointer"
                    >
                      Change Photo
                    </label>

                    <input
                      id="profile-image"
                      type="file"
                      accept="image/png, image/jpeg, image/webp"
                      class="hidden"
                    />

                    <p class="mt-2 text-xs text-slate-400">JPG, PNG or WEBP</p>
                  </div>
                </div>
                <label class="block text-sm mb-2 text-slate-600">
                  First Name
                </label>

                <input
                  value="Saeed"
                  class="w-full rounded-lg border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>

              <div>
                <label class="block text-sm mb-2 text-slate-600">
                  Last Name
                </label>

                <input
                  value="Ebrahimi"
                  class="w-full rounded-lg border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>

              <div>
                <label class="block text-sm mb-2 text-slate-600"> Email </label>

                <input
                  value="admin@autocare.com"
                  class="w-full rounded-lg border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>

              <div>
                <label class="block text-sm mb-2 text-slate-600"> Phone </label>

                <input
                  value="+98 912 0000000"
                  class="w-full rounded-lg border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>
            </div>

            <button
              class="mt-6 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-medium"
            >
              Save Changes
            </button>
          </section>

          <!-- System Settings -->

          <section
            class="bg-white rounded-xl border border-slate-200 shadow-sm p-6"
          >
            <h2 class="text-xl font-bold mb-6">System</h2>

            <div class="space-y-5">
              <div class="flex justify-between items-center">
                <div>
                  <p class="font-medium">Email Notifications</p>

                  <p class="text-sm text-">Receive appointment alerts</p>
                </div>

                <input
                  type="checkbox"
                  checked
                  class="w-5 h-5 accent-indigo-600"
                />
              </div>

              <div class="flex justify-between items-center">
                <div>
                  <p class="font-medium">SMS Notifications</p>

                  <p class="text-sm text-">Send customer reminders</p>
                </div>

                <input type="checkbox" class="w-5 h-5 accent-indigo-600" />
              </div>

              <div class="flex justify-between items-center">
                <div>
                  <p class="font-medium">Dark Mode</p>

                  <p class="text-sm text-">Enable dark theme</p>
                </div>

                <input type="checkbox" class="w-5 h-5 accent-indigo-600" />
              </div>
            </div>
          </section>

          <!-- Business Information -->

          <section
            class="xl:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm p-6"
          >
            <h2 class="text-xl font-bold mb-6">Business Information</h2>

            <div class="grid md:grid-cols-2 gap-5">
              <input
                placeholder="Business Name"
                class="border border-slate-200 rounded-lg px-4 py-3"
              />

              <input
                placeholder="Website"
                class="border border-slate-200 rounded-lg px-4 py-3"
              />

              <input
                placeholder="Address"
                class="border border-slate-200 rounded-lg px-4 py-3"
              />

              <input
                placeholder="Working Hours"
                class="border border-slate-200 rounded-lg px-4 py-3"
              />
            </div>
          </section>

          <!-- Security -->

          <section
            class="bg-white rounded-xl border border-slate-200 shadow-sm p-6"
          >
            <h2 class="text-xl font-bold mb-6">Security</h2>

            <div class="space-y-4">
              <button
                class="w-full text-left border border-slate-200 rounded-lg p-4 hover:bg-slate-50"
              >
                Change Password
              </button>

              <button
                class="w-full text-left border border-slate-200 rounded-lg p-4 hover:bg-slate-50"
              >
                Two Factor Authentication
              </button>

              <button
                class="w-full text-left border border-red-200 text-red-600 rounded-lg p-4 hover:bg-red-50"
              >
                Logout All Devices
              </button>
            </div>
          </section>
        </div>

        <div
          id="overlay"
          class="overlay hidden absolute inset-0 bg-black/40 z-40"
        ></div>
        <div id="modal-container"></div>
      </main>
    </div>

    <script
      type="module"
      src="../../../scripts/pages/admin/settings.js"
    ></script>
    <script type="module" src="../../../scripts/shared.js"></script>
  </body>
</html>
