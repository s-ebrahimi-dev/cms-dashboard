<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AutoCare - Customers</title>

    <link rel="stylesheet" href="/styles/app.css" />
  </head>

  <body class="relative bg-slate-50 text-slate-900">
    <svg class="hidden">
      <symbol
        id="arrow-right"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m8.25 4.5 7.5 7.5-7.5 7.5"
        />
      </symbol>
      <symbol
        id="arrow-left"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15.75 19.5 8.25 12l7.5-7.5"
        />
      </symbol>
    </svg>
    <div class="layout">
      <!-- Sidebar -->

      <section id="sidebar-container" class="sidebar-container z-50">
        <!-- Data Loaded By Js -->
      </section>

      <!-- Mobile sidebar -->
      <section id="mobile-sidebar-container">
        <!-- Data loaded By JS -->
      </section>
      <!-- Main Content -->

      <main class="main">
        <!-- Header -->
        <header class="flex relative items-center justify-between mb-8">
          <div>
            <h2 class="text-3xl font-bold">Customers</h2>

            <p class="text-slate-500 mt-1">
              Welcome back, manage your auto service center
            </p>
          </div>

          <div class="flex items-center gap-4">
            <input
              class="hidden md:block w-72 px-4 py-3 rounded-xl border border-slate-200 bg-white outline-none focus:ring-2 focus:ring-indigo-500"
              placeholder="Search..."
            />

            <button
              class="w-12 h-12 rounded-xl bg-white border border-slate-200"
            >
              🔔
            </button>

            <div
              class="flex items-center justify-between gap-3 md:w-25 md:gap-0.5 md:pr-2 bg-white rounded-full shrink-0 border border-slate-200"
            >
              <div>
                <img
                  src="/images/default-profile.png"
                  class="user-image w-10 h-10 md:w-8 md:h-8 rounded-full object-cover bg-indigo-600"
                  alt="user-image"
                />
              </div>

              <div class="hidden md:block">
                <p class="font-semibold md:text-[10px] text-sm">Saeed</p>
                <p class="text-xs md:text-[8px] text-slate-500">Administrator</p>
              </div>
            </div>
          </div>
        </header>
        <header class="flex flex-col lg:flex-row justify-end gap-5 mb-8">
          <div class="flex gap-3">
            <button
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-lg font-medium"
            >
              + Add Customer
            </button>
          </div>
        </header>

        <!-- Customers Table -->

        <section
          class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 overflow-x-auto"
        >
          <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-slate-600">
              <tr>
                <th class="p-4">#</th>

                <th class="p-4">Customer</th>

                <th class="p-4">Phone</th>

                <th class="p-4">Email</th>

                <th class="p-4">Vehicles</th>

                <th class="p-4">Joined</th>

                <th class="p-4">Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="p-4">1</td>

                <td class="p-4 font-semibold">John Smith</td>

                <td class="p-4">+1 555-1234</td>

                <td class="p-4">john@gmail.com</td>

                <td class="p-4">2</td>

                <td class="p-4">Aug 12, 2026</td>

                <td class="p-4">
                  <button class="text-blue-600 mr-3">👁</button>

                  <button class="text-green-600 mr-3">✎</button>

                  <button class="text-red-600">🗑</button>
                </td>
              </tr>

              <tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="p-4">2</td>

                <td class="p-4 font-semibold">Alice Johnson</td>

                <td class="p-4">+1 555-5678</td>

                <td class="p-4">alice@gmail.com</td>

                <td class="p-4">1</td>

                <td class="p-4">Aug 15, 2026</td>

                <td class="p-4">
                  <button class="text-blue-600 mr-3">👁</button>

                  <button class="text-green-600 mr-3">✎</button>

                  <button class="text-red-600">🗑</button>
                </td>
              </tr>

              <tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="p-4">3</td>

                <td class="p-4 font-semibold">Robert Brown</td>

                <td class="p-4">+1 555-7890</td>

                <td class="p-4">robert@gmail.com</td>

                <td class="p-4">3</td>

                <td class="p-4">Aug 18, 2026</td>

                <td class="p-4">
                  <button class="text-blue-600 mr-3">👁</button>

                  <button class="text-green-600 mr-3">✎</button>

                  <button class="text-red-600">🗑</button>
                </td>
              </tr>
            </tbody>
          </table>

          <!-- Pagination -->

          <div class="flex gap-2 mt-6">
            <button class="w-10 h-10 rounded-lg bg-indigo-600 text-white">
              1
            </button>

            <button
              class="w-10 h-10 rounded-lg bg-slate-100 hover:bg-slate-200"
            >
              2
            </button>

            <button
              class="w-10 h-10 rounded-lg bg-slate-100 hover:bg-slate-200"
            >
              3
            </button>
          </div>
        </section>
        <!-- Overlay -->
        <div
          id="overlay"
          class="overlay hidden fixed inset-0 bg-black/50 z-40 lg:hidden"
        ></div>
         <div id="modal-container"></div>
      </main>
    </div>

    <script
      type="module"
      src="../../../scripts/pages/admin/customers.js"
    ></script>
    <script type="module" src="../../../scripts/shared.js"></script>
  </body>
</html>
