<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Users | AutoCare Admin</title>

    <link rel="stylesheet" href="/styles/app.css" />
    <script src="../../../scripts/theme.js"></script>
  </head>

  <body class="relative min-h-screen text-slate-800">
    <svg class="hidden">
      <symbol
        id="arrow-right"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m8.25 4.5 7.5 7.5-7.5 7.5"
        />
      </symbol>
      <symbol
        id="arrow-left"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15.75 19.5 8.25 12l7.5-7.5"
        />
      </symbol>
      <symbol
        id="moon"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
        />
      </symbol>
      <symbol
        id="sun"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
        />
      </symbol>
    </svg>
    <!-- =====================================================
         Layout
    ====================================================== -->
    <div class="layout">
      <!-- Sidebar -->
      <section id="sidebar-container" class="sidebar-container z-50">
        <!-- Data Loaded By Js -->
      </section>

      <!-- Mobile sidebar -->
      <section id="mobile-sidebar-container">
        <!-- Data loaded By JS -->
      </section>
      <main class="main">
        <!-- TOP BAR -->

        <header class="flex items-center justify-between mb-8">
          <div>
            <h2 class="text-3xl font-bold">Users</h2>

            <p class="mt-1">Manage users and their access roles.</p>
          </div>

          <div class="flex items-center gap-4">
            <input
              class="hidden md:block w-72 px-4 py-3 rounded-xl border outline-none focus:ring-2 focus:ring-indigo-500"
              placeholder="Search..."
            />

            <button class="w-12 h-12 rounded-xl border">🔔</button>

            <div
              class="flex items-center justify-between gap-3 md:w-25 md:gap-0.5 md:pr-2 rounded-full shrink-0 border"
            >
              <div>
                <img
                  src="/images/default-profile.png"
                  class="user-image w-10 h-10 md:w-8 md:h-8 rounded-full object-cover bg-indigo-600"
                  alt="user-image"
                />
              </div>

              <div class="hidden md:block">
                <p class="font-semibold md:text-[10px] text-sm">Saeed</p>
                <p class="text-xs md:text-[8px] text-">Administrator</p>
              </div>
            </div>
          </div>
          <div class="theme-btn cursor-default sm:cursor-pointer">
            <svg class="inline-block dark:hidden w-5 h-5">
              <use href="#moon"></use>
            </svg>
            <svg class="hidden dark:inline-block w-5 h-5">
              <use href="#sun"></use>
            </svg>
          </div>
        </header>

        <!-- =========================
             USERS CONTENT
        ========================== -->

        <div class="p-5 sm:p-6 lg:p-8">
          <!-- PAGE TITLE -->

          <section
            class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
          >
            <button
              id="openCreateUserModal"
              type="button"
              class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-orange-600"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                class="h-5 w-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 4.5v15m7.5-7.5h-15"
                />
              </svg>

              Create User
            </button>
          </section>

          <!-- USERS TABLE CARD -->

          <section class="overflow-hidden border rounded-2xl shadow-sm">
            <!-- SEARCH -->

            <div
              class="flex flex-col gap-4 border-b p-5 md:flex-row md:items-center md:justify-between"
            >
              <div class="relative w-full md:max-w-sm">
                <input
                  id="searchUsers"
                  type="search"
                  placeholder="Search users..."
                  class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm outline-none transition placeholder:text-slate-400 focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
                />
              </div>

              <select
                id="roleFilter"
                class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm outline-none focus:border-orange-500 md:w-52"
              >
                <option value="ALL">All Roles</option>

                <option value="ADMIN">Admin</option>

                <option value="CUSTOMER">Customer</option>

                <option value="RECEPTIONIST">Receptionist</option>

                <option value="MECHANIC">Mechanic</option>

                <option value="OIL_SERVICE">Oil Service</option>

                <option value="BODY_REPAIR">Body Repair</option>

                <option value="DETAILING">Detailing</option>
              </select>
            </div>

            <!-- TABLE -->

            <div class="overflow-x-auto">
              <table class="w-full min-w-[900px] text-left">
                <thead class="bg-slate-50">
                  <tr>
                    <th
                      class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-"
                    >
                      User
                    </th>

                    <th
                      class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-"
                    >
                      Email
                    </th>

                    <th
                      class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-"
                    >
                      Role
                    </th>

                    <th
                      class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-"
                    >
                      Phone
                    </th>

                    <th
                      class="px-6 py-4 text-right text-xs font-semibold uppercase tracking-wider text-"
                    >
                      Actions
                    </th>
                  </tr>
                </thead>

                <tbody id="usersTableBody" class="divide-y divide-slate-100/30">
                  <!-- Users Loaded By Js-->
                </tbody>
              </table>
            </div>

            <!-- PAGINATION -->

            <div
              class="flex flex-col gap-3 border-t px-6 py-4 sm:flex-row sm:items-center sm:justify-between"
            >
              <p class="text-sm text-">
                Showing
                <span class="font-medium text-slate-700"> 1 </span>
                to
                <span class="font-medium text-slate-700"> 10 </span>
                of
                <span class="font-medium text-slate-700"> 24 </span>
                users
              </p>

              <div class="flex items-center gap-1">
                <button
                  class="rounded-lg border px-3 py-2 text-sm text-slate-400"
                >
                  Previous
                </button>

                <button
                  class="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white"
                >
                  1
                </button>

                <button class="rounded-lg px-3 py-2 text-sm hover:bg-slate-100">
                  2
                </button>

                <button class="rounded-lg px-3 py-2 text-sm hover:bg-slate-100">
                  3
                </button>

                <button class="rounded-lg border px-3 py-2 text-sm">
                  Next
                </button>
              </div>
            </div>
          </section>
        </div>

        <div
          id="overlay"
          class="overlay hidden fixed inset-0 bg-black/20 z-40"
        ></div>
        <div id="modal-container"></div>
      </main>

      <!-- =====================================================
         SIDEBAR
    ====================================================== -->

      <!-- =====================================================
         PAGE CONTENT
    ====================================================== -->

      <!-- =====================================================
         CREATE / EDIT / DELETE MODALS
         
         We can keep the modal markup from the previous
         version here.
    ====================================================== -->
      <!-- =====================================================
         CREATE USER MODAL
    ====================================================== -->

      <div
        id="createUserModal"
        class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/60 px-4 backdrop-blur-sm"
      >
        <div
          class="w-full bg-white max-w-lg overflow-hidden rounded-2xl shadow-2xl"
        >
          <!-- HEADER -->

          <div class="flex items-start justify-between border-b px-6 py-5">
            <div>
              <h2 class="text-xl font-bold text-slate-900">Create New User</h2>

              <p class="mt-1 text-sm text-">
                Add a new user and assign a role.
              </p>
            </div>

            <button
              id="closeCreateUserModal"
              type="button"
              class="rounded-lg p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.8"
                stroke="currentColor"
                class="h-5 w-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M6 18 18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>

          <!-- FORM -->

          <form id="createUserForm" class="space-y-5 p-6">
            <!-- FIRST / LAST NAME -->

            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <div>
                <label
                  for="firstname"
                  class="mb-2 block text-sm font-medium text-slate-700"
                >
                  First Name
                </label>

                <input
                  id="firstname"
                  name="firstname"
                  type="text"
                  autocomplete="given-name"
                  placeholder="John"
                  class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
                />
              </div>

              <div>
                <label
                  for="lastname"
                  class="mb-2 block text-sm font-medium text-slate-700"
                >
                  Last Name
                </label>

                <input
                  id="lastname"
                  name="lastname"
                  type="text"
                  autocomplete="family-name"
                  placeholder="Doe"
                  class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
                />
              </div>
            </div>

            <!-- USERNAME -->

            <div>
              <label
                for="username"
                class="mb-2 block text-sm font-medium text-slate-700"
              >
                Username
              </label>

              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                placeholder="john_doe"
                class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
              />
            </div>

            <!-- EMAIL -->

            <div>
              <label
                for="email"
                class="mb-2 block text-sm font-medium text-slate-700"
              >
                Email
              </label>

              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="john@example.com"
                class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
              />
            </div>
            <div>
              <label
                for="phone"
                class="mb-2 block text-sm font-medium text-slate-700"
              >
                Phone
              </label>

              <input
                id="phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                placeholder="09123456789"
                class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
              />
            </div>

            <!-- PASSWORD -->

            <div>
              <label
                for="password"
                class="mb-2 block text-sm font-medium text-slate-700"
              >
                Password
              </label>

              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                placeholder="••••••••"
                class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
              />
            </div>
            <div>
              <label
                for="password"
                class="mb-2 block text-sm font-medium text-slate-700"
              >
                Confirm Password
              </label>

              <input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                placeholder="••••••••"
                class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
              />
            </div>

            <!-- ROLE -->

            <div>
              <label
                for="role"
                class="mb-2 block text-sm font-medium text-slate-700"
              >
                Role
              </label>

              <select
                id="createRole"
                name="role"
                class="role h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm text-slate-700 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20"
              >
                <option value="" disabled selected>Select a role</option>
                <option value="CUSTOMER">Customer</option>

                <option value="RECEPTIONIST">Receptionist</option>

                <option value="MECHANIC">Mechanic</option>

                <option value="OIL_TECHNICIAN">Oil technician</option>

                <option value="BODY_REPAIR">Body Repair</option>

                <option value="DETAILING_TECHNICIAN">
                  Detailing technician
                </option>

                <option value="WASH_TECHNICIAN">Wash technician</option>
                <option value="ADMIN">Admin</option>
              </select>
            </div>

            <!-- FOOTER -->

            <div
              class="flex flex-col-reverse gap-3 border-t pt-5 sm:flex-row sm:justify-end"
            >
              <button
                id="cancelCreateUser"
                type="button"
                class="rounded-lg border border-slate-300 px-5 py-2.5 text-sm font-semibold transition"
              >
                Cancel
              </button>

              <button
                id="submit-user"
                type="submit"
                class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-orange-500/30"
              >
                Create User
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- =====================================================
         EDIT USER MODAL
    ====================================================== -->

      <div id="delete-user-modal-container"></div>
      <div id="edit-user-modal-container"></div>
    </div>

    <script type="module" src="../../../scripts/pages/admin/users.js"></script>
    <script type="module" src="../../../scripts/shared.js"></script>
  </body>
</html>
