<div
  id="editUserModal"
  class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 px-4 backdrop-blur-sm"
>
  <div class="w-full bg-white max-w-lg overflow-hidden rounded-2xl shadow-2xl">
    <!-- HEADER -->

    <div class="flex items-start justify-between border-b px-6 py-5">
      <div>
        <h2 class="text-xl font-bold text-slate-900">Edit User</h2>

        <p class="mt-1 text-sm text-">Update user information and role.</p>
      </div>

      <button
        id="closeEditUserModal"
        type="button"
        class="rounded-lg p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.8"
          stroke="currentColor"
          class="h-5 w-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18 18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- FORM -->

    <div id="editUserForm" class="space-y-5 p-6">
      <!-- USER ID -->

      <input id="editUserId" type="hidden" />

      <!-- FIRST / LAST NAME -->

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label
            for="editFirstname"
            class="mb-2 block text-sm font-medium text-slate-700"
          >
            First Name
          </label>

          <input
            id="editFirstname"
            name="firstname"
            type="text"
            class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm outline-none transition focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
          />
        </div>

        <div>
          <label
            for="editLastname"
            class="mb-2 block text-sm font-medium text-slate-700"
          >
            Last Name
          </label>

          <input
            id="editLastname"
            name="lastname"
            type="text"
            class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm outline-none transition focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
          />
        </div>
      </div>

      <!-- USERNAME -->

      <div>
        <label
          for="editUsername"
          class="mb-2 block text-sm font-medium text-slate-700"
        >
          Username
        </label>

        <input
          id="editUsername"
          name="username"
          type="text"
          class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm outline-none transition focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
        />
      </div>

      <!-- EMAIL -->

      <div>
        <label
          for="editEmail"
          class="mb-2 block text-sm font-medium text-slate-700"
        >
          Email
        </label>

        <input
          id="editEmail"
          name="email"
          type="email"
          class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm outline-none transition focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
        />
      </div>

      <!-- Phone -->
      <div>
        <label
          for="editPhone"
          class="mb-2 block text-sm font-medium text-slate-700"
        >
          Phone
        </label>

        <input
          id="editPhone"
          name="phone"
          type="string"
          class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm outline-none transition focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
        />
      </div>
      <!-- PASSWORD -->

      <div>
        <label
          for="editPassword"
          class="mb-2 block text-sm font-medium text-slate-700"
        >
          New Password
          <span class="font-normal text-slate-400"> (optional) </span>
        </label>

        <input
          id="editPassword"
          name="password"
          type="password"
          autocomplete="new-password"
          placeholder="Leave empty to keep current password"
          class="h-11 w-full rounded-lg border border-slate-300 bg-slate-50 px-4 text-sm outline-none transition placeholder:text-xs placeholder:text-slate-400 focus:border-orange-500 focus: focus:ring-2 focus:ring-orange-500/20"
        />
      </div>

      <!-- FOOTER -->

      <div
        class="flex flex-col-reverse gap-3 border-t pt-5 sm:flex-row sm:justify-end"
      >
        <button
          id="cancelEditUser"
          type="button"
          class="rounded-lg border border-slate-300 hover:bg-red-400 px-5 py-2.5 text-sm font-semibold transition"
        >
          Cancel
        </button>

        <button
          id="confirmEditUser"
          type="button"
          class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-600"
        >
          Save Changes
        </button>
      </div>
    </div>
  </div>
</div>
