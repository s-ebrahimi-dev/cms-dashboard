<div
  id="delete-user-modal"
  class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 px-4"
>
  <div
    class="w-full max-w-md rounded-2xl bg-[#E9E7E1]  p-6 shadow-xl dark:bg-[#1D2630]"
  >
    <h2 id="delete-user-title" class="mb-2 text-xl font-bold">
      Delete User
    </h2>

    <p id="delete-user-message" class="text-sm text-zinc-500">
      Are you sure you want to delete this user?
    </p>

    <div class="mt-6 flex justify-end gap-3">
      <button
        id="cancel-delete-user"
        type="button"
        class="cursor-default rounded-lg border border-zinc-300 bg-white px-4 py-2 text-black sm:cursor-pointer"
      >
        Cancel
      </button>

      <button
        id="confirm-delete-user"
        type="button"
        class="cursor-default rounded-lg bg-[#EF6A6A] px-4 py-2 text-white sm:cursor-pointer"
      >
        Delete
      </button>
    </div>
  </div>
</div>
